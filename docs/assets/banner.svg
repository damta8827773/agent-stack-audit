<svg width="1400" height="700" viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
    <radialGradient id="bgGlow" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#132436"/>
      <stop offset="55%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#04070c"/>
    </radialGradient>

    <linearGradient id="titleMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="titleBottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <radialGradient id="orbAgent" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#123244"/>
      <stop offset="100%" stop-color="#081722"/>
    </radialGradient>
    <radialGradient id="orbStack" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1b2350"/>
      <stop offset="100%" stop-color="#0c1030"/>
    </radialGradient>
    <radialGradient id="orbAudit" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#152c2a"/>
      <stop offset="100%" stop-color="#08120f"/>
    </radialGradient>

    <linearGradient id="ringAgent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ringStack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ringAudit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="panelBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3b52" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141d2b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="700" fill="url(#bgGlow)"/>

  <!-- symmetric faint circuit traces + binary, both sides -->
  <g stroke="#16222f" stroke-width="1.5" fill="none">
    <path d="M0,50 H120 V16 H280"/>
    <path d="M1400,50 H1280 V16 H1120"/>
    <path d="M0,650 H90 V684 H240"/>
    <path d="M1400,650 H1310 V684 H1160"/>
  </g>
  <g fill="#22344a">
    <circle cx="120" cy="16" r="3"/><circle cx="280" cy="16" r="3"/>
    <circle cx="1280" cy="16" r="3"/><circle cx="1120" cy="16" r="3"/>
    <circle cx="90" cy="684" r="3"/><circle cx="1310" cy="684" r="3"/>
  </g>
  <g class="mono" fill="#182636" font-size="14">
    <text x="20" y="14">01001010</text>
    <text x="1290" y="14" text-anchor="end">11001101</text>
    <text x="20" y="694">0110 1010</text>
    <text x="1380" y="694" text-anchor="end">10110100</text>
  </g>

  <!-- title -->
  <text x="700" y="98" text-anchor="middle" class="mono" font-size="58" font-weight="800" fill="#f3f7fb">AI AGENT</text>
  <text x="700" y="164" text-anchor="middle" class="mono" font-size="58" font-weight="800" fill="url(#titleMid)">STACK SYSTEM</text>
  <text x="700" y="230" text-anchor="middle" class="mono" font-size="58" font-weight="800" fill="url(#titleBottom)">AUDIT ENGINE</text>
  <text x="700" y="270" text-anchor="middle" class="mono" font-size="21" fill="#8ea3b8">Audit your AI agent's skill stack</text>

  <!-- ============ PANEL 1: AI AGENT ============ -->
  <g transform="translate(90,320)">
    <rect width="380" height="300" rx="18" fill="#0b131d" stroke="url(#panelBorder)" stroke-width="1.5"/>
    <circle cx="190" cy="118" r="82" fill="url(#orbAgent)" stroke="url(#ringAgent)" stroke-width="2.5" filter="url(#glow)"/>
    <g transform="translate(190,118)" stroke="url(#ringAgent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSoft)">
      <rect x="-30" y="-22" width="60" height="46" rx="14"/>
      <circle cx="-12" cy="-1" r="4.4" fill="url(#ringAgent)" stroke="none"/>
      <circle cx="12" cy="-1" r="4.4" fill="url(#ringAgent)" stroke="none"/>
      <path d="M-14,15 H14"/>
      <path d="M0,-22 V-38"/>
      <circle cx="0" cy="-42" r="4" fill="none"/>
      <path d="M-30,6 H-46 M-30,-8 H-42"/>
      <path d="M30,6 H46 M30,-8 H42"/>
      <path d="M-9,24 V34 M9,24 V34"/>
    </g>
    <text x="190" y="240" text-anchor="middle" class="mono" font-size="25" font-weight="700" fill="#e7eef6">AI AGENT</text>
    <text x="190" y="270" text-anchor="middle" class="mono" font-size="16" fill="#7c92a8">Think. Learn. Act.</text>
  </g>

  <!-- ============ PANEL 2: STACK SYSTEM ============ -->
  <g transform="translate(510,320)">
    <rect width="380" height="300" rx="18" fill="#0b0f1d" stroke="url(#panelBorder)" stroke-width="1.5"/>
    <circle cx="190" cy="118" r="82" fill="url(#orbStack)" stroke="url(#ringStack)" stroke-width="2.5" filter="url(#glow)"/>
    <g transform="translate(190,90)" stroke="url(#ringStack)" stroke-width="3" fill="none" stroke-linejoin="round" filter="url(#glowSoft)">
      <!-- plug -->
      <path d="M-15,4 H-6 V-6 H6 V4 H15 V22 H-15 Z" transform="translate(0,-6)"/>
      <!-- gear -->
      <g transform="translate(0,42)">
        <circle r="15"/>
        <circle r="5" fill="url(#ringStack)" stroke="none"/>
        <g stroke-linecap="round">
          <path d="M0,-19 V-25"/><path d="M0,19 V25"/>
          <path d="M-19,0 H-25"/><path d="M19,0 H25"/>
          <path d="M-13,-13 L-17,-17"/><path d="M13,-13 L17,-17"/>
          <path d="M-13,13 L-17,17"/><path d="M13,13 L17,17"/>
        </g>
      </g>
      <!-- hook -->
      <g transform="translate(0,86)" stroke-linecap="round">
        <path d="M-11,-12 v14 a11,11 0 0 0 22,0 v-20"/>
      </g>
    </g>
    <text x="190" y="240" text-anchor="middle" class="mono" font-size="25" font-weight="700" fill="#e7eef6">STACK SYSTEM</text>
    <text x="190" y="270" text-anchor="middle" class="mono" font-size="16" fill="#7c92a8">Skills. Plugins. Hooks.</text>
  </g>

  <!-- ============ PANEL 3: AUDIT ENGINE ============ -->
  <g transform="translate(930,320)">
    <rect width="380" height="300" rx="18" fill="#081712" stroke="url(#panelBorder)" stroke-width="1.5"/>
    <circle cx="190" cy="118" r="82" fill="url(#orbAudit)" stroke="url(#ringAudit)" stroke-width="2.5" filter="url(#glow)"/>
    <g stroke="#3f6b5b" stroke-width="1.8" fill="none" opacity="0.9">
      <g transform="translate(150,78)">
        <rect x="-9" y="-9" width="18" height="18" rx="2"/>
        <path d="M-9,-4 H-15 M-9,4 H-15 M9,-4 H15 M9,4 H15 M-4,-9 V-15 M4,-9 V-15 M-4,9 V15 M4,9 V15"/>
      </g>
      <g transform="translate(230,78)">
        <rect x="-7" y="-1" width="14" height="12" rx="2"/>
        <path d="M-5,-1 v-5 a5,5 0 0 1 10,0 v5"/>
      </g>
    </g>
    <g transform="translate(190,124)" stroke="url(#ringAudit)" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowSoft)">
      <path d="M0,-30 L27,-19 V10 C27,30 14,44 0,50 C-14,44 -27,30 -27,10 V-19 Z"/>
      <path d="M-12,3 L-3,15 L15,-12" transform="translate(0,4)"/>
    </g>
    <text x="190" y="240" text-anchor="middle" class="mono" font-size="25" font-weight="700" fill="#e7eef6">AUDIT ENGINE</text>
    <text x="190" y="270" text-anchor="middle" class="mono" font-size="16" fill="#7c92a8">Scan. Analyze. Assure.</text>
  </g>

  <!-- connectors between panels -->
  <line x1="470" y1="470" x2="510" y2="470" stroke="#33465c" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="890" y1="470" x2="930" y2="470" stroke="#33465c" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- footer -->
  <text x="700" y="662" text-anchor="middle" class="mono" font-size="16" fill="#8ea3b8">by damta8827773 · GitHub Repository</text>
  <text x="700" y="686" text-anchor="middle" class="mono" font-size="15" fill="#5b7288">github.com/damta8827773/agent-stack-audit</text>
</svg>
