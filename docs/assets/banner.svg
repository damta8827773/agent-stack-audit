<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#0d1117"/>

  <!-- faint baseline grid, not a glow/gradient -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- terminal chrome dots -->
  <g transform="translate(48,48)">
    <circle cx="0" cy="0" r="7" fill="#ff5f56"/>
    <circle cx="24" cy="0" r="7" fill="#ffbd2e"/>
    <circle cx="48" cy="0" r="7" fill="#27c93f"/>
  </g>

  <!-- prompt + title -->
  <text x="48" y="130" class="mono" font-size="22" fill="#8b949e">$ agent-stack-audit scan</text>
  <text x="48" y="196" class="mono" font-size="56" font-weight="700" fill="#e6edf3">agent-stack-audit</text>
  <text x="48" y="234" class="mono" font-size="20" fill="#8b949e">read-only audit for Claude Code skills, plugins &amp; hooks</text>

  <!-- module pills -->
  <g class="mono" font-size="16" fill="#c9d1d9">
    <g transform="translate(48,268)">
      <rect width="118" height="34" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="59" y="22" text-anchor="middle">discover</text>
    </g>
    <g transform="translate(178,268)">
      <rect width="176" height="34" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="88" y="22" text-anchor="middle">conflict-check</text>
    </g>
    <g transform="translate(366,268)">
      <rect width="140" height="34" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="70" y="22" text-anchor="middle">token-cost</text>
    </g>
    <g transform="translate(518,268)">
      <rect width="152" height="34" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="76" y="22" text-anchor="middle">memory-audit</text>
    </g>
    <g transform="translate(682,268)">
      <rect width="136" height="34" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="68" y="22" text-anchor="middle">trust-report</text>
    </g>
  </g>

  <!-- confidence-level legend, matching the tool's real output verbatim -->
  <g class="mono" font-size="15">
    <circle cx="56" cy="345" r="6" fill="#f85149"/>
    <text x="72" y="350" fill="#8b949e">CONFIRMED</text>

    <circle cx="220" cy="345" r="6" fill="#d29922"/>
    <text x="236" y="350" fill="#8b949e">LIKELY</text>

    <circle cx="352" cy="345" r="6" fill="#6e7681"/>
    <text x="368" y="350" fill="#8b949e">INFORMATIONAL</text>
  </g>

  <text x="1152" y="368" class="mono" font-size="14" fill="#484f58" text-anchor="end">MIT · Go</text>
</svg>
