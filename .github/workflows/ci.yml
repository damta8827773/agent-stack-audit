name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - name: gofmt check
        shell: bash
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt -l found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - run: go build ./...
      - run: go test ./... -race -cover

  cross-build:
    # Native install has no CGO dependency (modernc.org/sqlite is pure Go),
    # so every FASE 11 target platform builds from a single Linux runner
    # with CGO disabled.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cmd/agent-stack-audit

  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: |
          f=skills/agent-stack-audit/SKILL.md
          test -f "$f" || { echo "$f not found"; exit 1; }
          head -1 "$f" | grep -q '^---$' || { echo "$f missing opening frontmatter delimiter"; exit 1; }
          grep -q '^name:' "$f" || { echo "$f frontmatter missing 'name'"; exit 1; }
          grep -q '^description:' "$f" || { echo "$f frontmatter missing 'description'"; exit 1; }

  fuzz:
    # Short, permanent fuzz runs for discover's YAML/JSON parsers (docs/
    # ROADMAP.md v0.2 item) - not exhaustive, but enough to keep catching a
    # regression that makes one of these panic on malformed input, which is
    # expected real-world input per FASE 3 (a corrupt config file is a
    # warning, never fatal).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Fuzz discover parsers
        run: |
          set -e
          for fn in FuzzParseFrontmatter FuzzExtractHooks FuzzJSONManifest FuzzStripBOM; do
            go test ./internal/discover/... -run=^$ -fuzz=^${fn}$ -fuzztime=15s
          done

  no-em-dash:
    # Permanent guard, not a one-time cleanup: fails the build if an em dash
    # (—, U+2014) creeps back into any tracked .go or .md file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for em dash
        run: |
          if grep -rn $'\xe2\x80\x94' --include='*.go' --include='*.md' .; then
            echo ""
            echo "Found an em dash character in a tracked .go/.md file (shown above)."
            echo "Replace it with a plain hyphen (-)."
            exit 1
          fi
          echo "No em dash found."
